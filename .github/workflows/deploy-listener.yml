name: Build and deploy listener

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-listener
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-listener" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push listener image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: listener
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=PolySwap listener
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.VPS_HOST }}
      DEPLOY_USER: ${{ secrets.VPS_USER }}
      DEPLOY_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
      SSH_KEY_FILE: ${{ runner.temp }}/listener_deploy_key
      KNOWN_HOSTS_FILE: ${{ runner.temp }}/listener_known_hosts
      LISTENER_IMAGE: ${{ needs.build.outputs.image }}
      LISTENER_ENV_FILE: ${{ vars.LISTENER_ENV_FILE || '/opt/polyswap/listener.env' }}
      REMOTE_DOCKER_CONFIG: /tmp/polyswap-ghcr-${{ github.run_id }}-${{ github.run_attempt }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
    steps:
      - name: Check out deployment script
        uses: actions/checkout@v6

      - name: Configure SSH
        shell: bash
        run: |
          install -m 600 /dev/null "$SSH_KEY_FILE"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_KEY_FILE"
          install -m 600 /dev/null "$KNOWN_HOSTS_FILE"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$KNOWN_HOSTS_FILE"

      - name: Authenticate VPS to GHCR
        shell: bash
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh \
            -i "$SSH_KEY_FILE" \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "install -d -m 700 '$REMOTE_DOCKER_CONFIG' && docker --config '$REMOTE_DOCKER_CONFIG' login ghcr.io --username '${{ github.actor }}' --password-stdin"

      - name: Deploy listener on VPS
        shell: bash
        run: |
          ssh \
            -i "$SSH_KEY_FILE" \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            sh -s -- "$LISTENER_IMAGE" "$LISTENER_ENV_FILE" "$REMOTE_DOCKER_CONFIG" \
            < .github/scripts/deploy-listener.sh

      - name: Remove temporary GHCR credentials from VPS
        if: always()
        shell: bash
        run: |
          ssh \
            -i "$SSH_KEY_FILE" \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker --config '$REMOTE_DOCKER_CONFIG' logout ghcr.io >/dev/null 2>&1 || true; rm -f '$REMOTE_DOCKER_CONFIG/config.json'; rmdir '$REMOTE_DOCKER_CONFIG' >/dev/null 2>&1 || true" \
            || true
