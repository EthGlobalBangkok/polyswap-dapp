name: Build and deploy listener

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-listener
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-listener" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push listener image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: listener
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=PolySwap listener
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.VPS_HOST }}
      DEPLOY_USER: polyswap-deploy
      DEPLOY_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
      LISTENER_IMAGE: ${{ needs.build.outputs.image }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/listener_deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/listener_deploy_key"
          install -m 600 /dev/null "$RUNNER_TEMP/listener_known_hosts"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/listener_known_hosts"

      - name: Deploy listener on VPS
        shell: bash
        run: |
          {
            printf '%s\n' "$LISTENER_IMAGE"
            printf '%s\n' "$GITHUB_ACTOR"
            printf '%s' "$GHCR_TOKEN"
          } | ssh -T \
            -i "$RUNNER_TEMP/listener_deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/listener_known_hosts" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST"
