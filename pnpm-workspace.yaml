allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': true
  '@sentry/cli': true
  '@tree-sitter-grammars/tree-sitter-yaml': true
  bufferutil: true
  core-js: true
  core-js-pure: true
  esbuild: true
  keccak: true
  prisma: true
  protobufjs: true
  sharp: true
  tree-sitter: true
  tree-sitter-json: true
  unrs-resolver: true
  utf-8-validate: true

# Pin pino to a non-vulnerable version. The chain wagmi → @wagmi/connectors →
# @walletconnect/ethereum-provider → @reown/appkit → @walletconnect/logger
# pulls pino@7.11.0, which has a known vulnerability. Upstream is blocked
# on a licensing dispute; we pin manually until they ship a fix.
overrides:
  # Force a single import-in-the-middle version everywhere. Next.js externalises
  # this package for the Node.js runtime, and the version it sees as "external"
  # must match the version each Sentry/OpenTelemetry consumer expects, otherwise
  # Turbopack emits a "different version when requested" warning.
  import-in-the-middle: "3.0.1"
